{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-white border-bottom">
            <div class="container">
                <a class="navbar-brand brand fw-bold" href="/"></a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                    >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavigation">
                    <div class="navbar-nav ms-auto align-items-md-center py-3 py-md-0">
                        <details class="category-menu">
                            <summary class="nav-link text-dark">Categories</summary>
                            <div class="category-submenu">
                                <a href="{% url 'shop:list' %}">All</a>
                                <a href="{% url 'shop:category' 'cab-driver' %}">Cab &amp; Driver
                                </a>
                                <a href="{% url 'shop:category' 'haulage-life' %}">Haulage Life
                                </a>
                                <a href="{% url 'shop:category' 'uk-motorways' %}">UK Motorway
                                </a>
                            </div>
                        </details>
                        <a class="nav-link text-dark" href="{% url 'shop:list' %}">Shop</a>
                        <a class="nav-link text-dark" href="{% url 'shop:cart' %}">Bag</a>
                            {% if user.is_authenticated %}
                        <a
                        class="nav-link text-dark"
                        href="{% url 'accounts:logout' %}">Log out
                        </a>
                            {% else %}
                        <a class="nav-link text-dark" href="{% url 'accounts:login' %}">Log in
                        </a>
                        <a class="nav-link text-dark" href="{% url 'accounts:register' %}">Register
                        </a>
                            {% endif %}
                    </div>
                </div>
            </div>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
