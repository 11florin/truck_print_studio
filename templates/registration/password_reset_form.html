{% extends "shop/base.html" %}
{% block title %}Reset password · Truck Print Studio{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px">
  <h1>Reset your password</h1>
  <p>Enter your email address and we will send you a reset link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-dark" type="submit">Send reset link</button>
  </form>
</div>
{% endblock %}
