{% extends "shop/base.html" %}

{% block title %}Register · Truck Print Studio{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:480px">
    <h1>Create your account</h1>
    <p class="text-muted">Join Truck Print Studio to save your favourites and manage your orders.</p>
    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-dark" type="submit">Register</button>
    </form>
    <p class="mt-3 mb-0">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
</div>
{% endblock %}
