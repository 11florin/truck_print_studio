{% extends "shop/base.html" %}
{% block content %}
<div class="container py-5">
  <h1>Your bag</h1>
  {% for item in items %}
    <div class="d-flex justify-content-between border-bottom py-3">
      <span>{{ item.product.name }} x {{ item.quantity }}</span>
      <span>
        £{{ item.total }}
        
        <a href="/"    
           class="text-danger ms-3">Remove</a>
      </span>
    </div>
  {% empty %}
    <p>Your bag is empty.</p>
  {% endfor %}
  {% if items %}
    <h3 class="text-end mt-4">Total: £{{ total }}</h3>
    <div class="text-end">
      <a href="{% url 'orders:checkout' %}" class="btn btn-dark">Checkout</a>
    </div>
  {% endif %}
</div>
{% endblock %}
